name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run ruff check src tests --config pyproject.toml

      - name: Ruff format check
        run: uv run ruff format --check src tests --config pyproject.toml

      - name: Pytest
        run: uv run pytest tests/unittest/test_backend -q
        env:
          DASHSCOPE_API_KEY: test-key-for-ci
          DEFAULT_LLM: qwen3.7-max
