[project]
name = "chatter-backend"
version = "0.1.0"
description = "RAG knowledge Q&A FastAPI backend"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic~=2.12.4",
    "pydantic-settings~=2.13.1",
    "python-dotenv~=1.0.0",
    "fastapi~=0.121.2",
    "litellm>=1.60.0",
    "python-multipart>=0.0.9",
    "uvicorn~=0.24.0",
    "llama-index-core>=0.14.23",
    "llama-index-readers-file>=0.6.0",
    "pypdf>=5.0.0",
    "llama-index-readers-database>=0.5.0",
    "llama-index-readers-web>=0.6.0",
    "httpx>=0.27.0",
    "llama-index-vector-stores-qdrant>=0.10.2",
    "llama-index-embeddings-dashscope>=0.5.0",
    "qdrant-client>=1.16.0,<1.17",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest~=9.0.2",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
