[project]
name = "chatter-frontend"
version = "0.1.0"
description = "RAG knowledge Q&A Streamlit frontend"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic~=2.12.4",
    "pydantic-settings~=2.13.1",
    "python-dotenv~=1.0.0",
    "streamlit~=1.52.1",
    "requests~=2.32.5",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest~=9.0.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
